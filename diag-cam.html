<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>摄像头手势诊断</title>
<style>
  html,body{margin:0;background:#05070f;color:#dfe9ff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{padding:12px 12px 40px}
  h2{font-size:16px;margin:4px 0 10px;letter-spacing:.05em}
  button{width:100%;padding:14px;border-radius:12px;border:1px solid #3a5aa8;background:#16224a;color:#dfe9ff;font-size:16px}
  button:active{filter:brightness(1.2)}
  #flip{margin-top:8px;background:#0f1a35;border-color:#2c4586}
  video{width:100%;max-width:380px;background:#000;border-radius:10px;margin-top:10px;display:block}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.55;background:#0a1020;border:1px solid #1d2b52;border-radius:10px;padding:10px;margin-top:10px}
  .ok{color:#7cf39a}.bad{color:#ff8f8f}.warn{color:#ffd45e}
</style>
</head>
<body>
<h2>摄像头手势诊断</h2>
<button id="go">开始诊断</button>
<button id="flip" hidden>切换前后摄像头（当前：前置）</button>
<video id="v" playsinline muted autoplay></video>
<pre id="out">点「开始诊断」，会自动试摄像头 + 手部模型，并把每一步结果列出来。</pre>
<script type="module">
const out = document.getElementById('out');
const lines = [];
function render() {
  out.innerHTML = '';
  for (const it of lines) {
    if (Array.isArray(it)) {
      const e = document.createElement('span');
      e.className = it[2] || '';
      e.textContent = it[0] + ': ' + it[1] + '\n';
      out.appendChild(e);
    } else {
      const e = document.createElement('span');
      e.textContent = it + '\n';
      out.appendChild(e);
    }
  }
}
const add = (k, v, cls) => { lines.push([k, v, cls]); render(); };
const addCls = add;

function wsSimd() {
  try {
    return WebAssembly.validate(new Uint8Array([
      0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11
    ]));
  } catch (e) { return false; }
}

const v = document.getElementById('v');
const flipBtn = document.getElementById('flip');
let facing = 'user';            // 默认前置：手机举在面前挥手，后置往往照着房间 → 假阴性
let stream = null;
let vision = null, fileset = null, lm = null, usedDelegate = '';

function labelFacing() {
  flipBtn.textContent = '切换前后摄像头（当前：' + (facing === 'user' ? '前置' : '后置') + '）';
}

async function openCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  v.srcObject = null;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  v.srcObject = stream;
  await v.play();
  await new Promise(r => setTimeout(r, 600));
  const st = stream.getVideoTracks()[0].getSettings();
  return { w: v.videoWidth, h: v.videoHeight, fps: st.frameRate || '?', realFacing: st.facingMode || facing };
}

async function run() {
  lines.length = 0;
  out.textContent = '';
  // 1) 环境
  addCls('安全上下文 https', location.protocol + ' // isSecureContext=' + isSecureContext, isSecureContext ? 'ok' : 'bad');
  addCls('UA', navigator.userAgent, '');
  addCls('WASM SIMD', wsSimd() ? '支持' : '不支持（可能缺 nosimd 版本 wasm）', wsSimd() ? 'ok' : 'bad');
  addCls('SharedArrayBuffer', (typeof SharedArrayBuffer !== 'undefined') ? '可用（多线程）' : '不可用（单线程）',
    (typeof SharedArrayBuffer !== 'undefined') ? 'ok' : 'warn');

  // 2) 摄像头
  try {
    const info = await openCam();
    addCls('摄像头', 'OK ' + info.w + 'x' + info.h + ' @' + info.fps + 'fps | 朝向=' + info.realFacing, 'ok');
    addCls('视频比例', (v.videoWidth / v.videoHeight).toFixed(3) + '  (' + (v.videoWidth >= v.videoHeight ? '横屏' : '竖屏') + ')', '');
    flipBtn.hidden = false; labelFacing();
  } catch (e) {
    addCls('摄像头', 'FAIL ' + e.name + ' ' + e.message, 'bad');
    return;
  }

  // 3) MediaPipe
  if (!vision) {
    try {
      vision = await import('./vendor/mediapipe/vision_bundle.mjs');
      addCls('加载 vision_bundle', 'OK', 'ok');
    } catch (e) {
      addCls('加载 vision_bundle', 'FAIL ' + e.message, 'bad');
      return;
    }
    try {
      fileset = await vision.FilesetResolver.forVisionTasks('./vendor/mediapipe/wasm');
      addCls('初始化 wasm', 'OK', 'ok');
    } catch (e) {
      addCls('初始化 wasm', 'FAIL ' + (e && (e.message || e)), 'bad');
      return;
    }
  }

  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: './vendor/hand_landmarker.task', delegate },
    runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  if (!lm) {
    try {
      const t0 = performance.now();
      lm = await vision.HandLandmarker.createFromOptions(fileset, opts('GPU'));
      usedDelegate = 'GPU';
      addCls('创建 HandLandmarker', 'GPU OK (' + Math.round(performance.now() - t0) + 'ms)', 'ok');
    } catch (eGpu) {
      addCls('GPU 委派', 'FAIL ' + (eGpu && (eGpu.message || eGpu)), 'warn');
      try {
        const t0 = performance.now();
        lm = await vision.HandLandmarker.createFromOptions(fileset, opts('CPU'));
        usedDelegate = 'CPU';
        addCls('创建 HandLandmarker', 'CPU OK (' + Math.round(performance.now() - t0) + 'ms)', 'ok');
      } catch (eCpu) {
        addCls('创建 HandLandmarker', 'CPU 也 FAIL ' + (eCpu && (eCpu.message || eCpu)), 'bad');
        return;
      }
    }
  }

  // 4) 检测 5 秒
  const cv = document.createElement('canvas');
  const ratio = v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 16 / 9;
  cv.width = 256; cv.height = Math.round(256 / ratio);
  const cx = cv.getContext('2d');
  addCls('检测输入尺寸', cv.width + 'x' + cv.height + '（按视频比例，避免拉伸）', '');

  let frames = 0, hits = 0, errs = 0, lastErr = '', best = 0;
  let statusIdx = -1, lastStatusAt = 0;
  const setStatus = (txt, cls) => {
    if (statusIdx < 0) { lines.push([k0, txt, cls]); statusIdx = lines.length - 1; }
    else { lines[statusIdx][1] = txt; lines[statusIdx][2] = cls; }
    render();
  };
  const k0 = '实时';
  const start = performance.now();
  await new Promise(resolve => {
    const tick = () => {
      const t = performance.now();
      try {
        cx.drawImage(v, 0, 0, cv.width, cv.height);
        const res = lm.detectForVideo(cv, t);
        frames++;
        if (res && res.landmarks && res.landmarks.length > 0) {
          hits++;
          const sc = res.handedness && res.handedness[0] && res.handedness[0][0] ? res.handedness[0][0].score : 0;
          if (sc > best) best = sc;
        }
      } catch (e) {
        errs++; lastErr = (e && (e.message || e)) + '';
      }
      if (t - lastStatusAt > 300 || frames === 1) {
        lastStatusAt = t;
        setStatus('帧=' + frames + ' 检测到手=' + hits + ' 最高置信=' + (best ? best.toFixed(2) : '—')
          + ' 错误=' + errs + (lastErr ? ' 最近:' + lastErr : ''),
          hits > 0 ? 'ok' : (errs ? 'bad' : 'warn'));
      }
      if (t - start < 5000) requestAnimationFrame(tick); else resolve();
    };
    requestAnimationFrame(tick);
  });
  setStatus('帧=' + frames + ' 检测到手=' + hits + ' 最高置信=' + (best ? best.toFixed(2) : '—')
    + ' 错误=' + errs, hits > 0 ? 'ok' : (errs ? 'bad' : 'warn'));

  addCls('=== 结论 ===', hits > 0 ? '能识别到手（' + hits + '/' + frames + ' 帧）' : '5 秒内没检出手！',
    hits > 0 ? 'ok' : 'bad');
  addCls('委派', usedDelegate, '');
  if (hits === 0) {
    addCls('排查', '① 确认开的是前置（画面里能看到自己）；② 手离镜头 40–60cm、整只手在框内；'
      + '③ 别逆光，脸/手要亮；④ 停住 1–2 秒别晃。', 'warn');
  }
}

document.getElementById('go').addEventListener('click', () => run().catch(e => addCls('异常', String(e && (e.stack || e)), 'bad')));
flipBtn.addEventListener('click', () => {
  facing = (facing === 'user') ? 'environment' : 'user';
  run().catch(e => addCls('异常', String(e && (e.stack || e)), 'bad'));
});

if (/[?&]auto=1/.test(location.search)) setTimeout(() => document.getElementById('go').click(), 400);
</script>
</body>
</html>
