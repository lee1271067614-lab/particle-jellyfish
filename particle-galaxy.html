<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>深海水母</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; }
  #c { display: block; position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #c.drag { cursor: grabbing; }

  .title {
    position: fixed; left: 44px; top: 38px; pointer-events: none; user-select: none;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .title h1 {
    margin: 0; padding-right: .42em;
    font-size: clamp(20px, 2.3vw, 30px); font-weight: 300; letter-spacing: .42em;
    background: linear-gradient(118deg, #ffffff 0%, #c8fff4 46%, #6fd8ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(90,230,220,.32));
  }
  .title .rule {
    width: 48px; height: 1px; margin: 15px 0 11px;
    background: linear-gradient(90deg, rgba(160,190,255,.95), rgba(160,190,255,0));
  }
  .title .sub {
    font-size: 10px; font-weight: 400; letter-spacing: .62em;
    color: #8095c8; opacity: .92; padding-left: 2px;
  }

  @media (max-width: 560px) {
    .title { left: 24px; top: 24px; }
  }

  /* ---- camera hand-gesture layer ---- */
  .gesture-btn {
    position: fixed; right: 24px; bottom: 24px; z-index: 20;
    padding: 10px 17px; border-radius: 999px; cursor: pointer;
    font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size: 12.5px; letter-spacing: .1em; color: #dfe9ff; white-space: nowrap;
    background: rgba(15,21,40,.5); border: 1px solid rgba(130,160,255,.28);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(18,28,78,.4); transition: filter .2s;
  }
  .gesture-btn:hover { filter: brightness(1.15); }
  .gesture-btn.hidden { display: none; }
  .sfx-btn { right: 24px; bottom: 70px; }

  /* 摄像头设备选择（常驻可见，运行中也能切；自动识别到 OBS 会优先，手动选过则永久记住）*/
  .cam-pick {
    position: fixed; right: 24px; bottom: 118px; z-index: 20;
    min-width: 158px; max-width: 210px; padding: 8px 10px; border-radius: 10px;
    background: rgba(12,18,34,.82); color: #cfe0ff; cursor: pointer;
    border: 1px solid rgba(130,160,255,.28); outline: none;
    font-size: 12px; font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(10,16,40,.5); transition: opacity .2s;
  }
  .cam-pick:hover { border-color: rgba(150,190,255,.5); }
  .cam-pick.hidepick { display: none; }
  .sfx-btn.off { opacity: .55; }

  .camera {
    position: fixed; right: 22px; bottom: 22px; width: 208px; z-index: 20;
    border-radius: 14px; overflow: hidden; display: none;
    background: #05070f; border: 1px solid rgba(130,160,255,.22);
    box-shadow: 0 12px 46px rgba(10,16,40,.55);
    font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .camera.on { display: block; }
  .camera video {
    display: block; width: 208px; height: 156px; object-fit: cover;
    transform: scaleX(-1); background: #05070f;
  }
  .camera canvas {
    position: absolute; inset: 0; width: 208px; height: 156px;
    pointer-events: none;
  }
  .cam-head {
    position: absolute; left: 10px; top: 8px; z-index: 2;
    font-size: 10px; letter-spacing: .22em; color: #cfe0ff; opacity: .92;
    text-shadow: 0 1px 6px rgba(0,0,0,.85); pointer-events: none;
  }
  .cam-hint {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 6px 10px; font-size: 11px; letter-spacing: .06em; color: #dfe9ff;
    background: linear-gradient(0deg, rgba(4,7,16,.9), rgba(4,7,16,0));
    pointer-events: none;
  }
  .cam-hint b { color: #8fd0ff; font-weight: 600; }
  .cam-close {
    position: absolute; right: 7px; top: 6px; z-index: 3; cursor: pointer;
    width: 20px; height: 20px; line-height: 19px; text-align: center;
    border-radius: 50%; font-size: 12px; color: #cdd9ff;
    background: rgba(20,28,54,.65); border: 1px solid rgba(130,160,255,.25);
  }
  .cam-close:hover { background: rgba(40,54,96,.85); }

  /* 开场提示语（由 JS 控制淡入淡出）*/
  .intro-tag {
    position: fixed; left: 0; right: 0; top: 63%; text-align: center; z-index: 15;
    font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size: 15px; letter-spacing: .42em; color: #bfe6ff; opacity: 0;
    text-shadow: 0 2px 18px rgba(90,180,255,.55); pointer-events: none;
  }

  /* ================= 手机端适配（安全区 + 触控尺寸 + PiP 移到右上）================= */
  @media (max-width: 820px), (pointer: coarse) {
    .title { left: calc(18px + env(safe-area-inset-left)); top: calc(18px + env(safe-area-inset-top)); }
    .title h1 { font-size: clamp(18px, 5.4vw, 26px); letter-spacing: .28em; }
    .title .rule { margin: 11px 0 8px; }
    .title .sub { letter-spacing: .42em; }
    .gesture-btn { right: calc(12px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 12px; padding: 9px 14px; }
    .sfx-btn { right: calc(12px + env(safe-area-inset-right)); bottom: calc(62px + env(safe-area-inset-bottom)); }
    .cam-pick { right: calc(12px + env(safe-area-inset-right)); bottom: calc(108px + env(safe-area-inset-bottom)); min-width: 120px; max-width: 54vw; font-size: 11px; padding: 7px 9px; }
    /* 摄像头小窗移到右上角，别和底部按钮挤 */
    .camera { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); bottom: auto; width: 126px; }
    .camera video, .camera canvas { width: 126px; height: 94px; }
    .intro-tag { font-size: 13px; letter-spacing: .28em; top: 60%; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">
  <h1>深海水母</h1>
  <div class="rule"></div>
  <div class="sub">生物荧光 · 幽蓝深渊</div>
</div>
<div id="introTag" class="intro-tag">握拳，让它炸开</div>
<button id="gestureBtn" class="gesture-btn">✋ 手势控制</button>
<button id="sfxBtn" class="gesture-btn sfx-btn" title="开关打击感音效">🔊 音效</button>
<select id="camPick" class="cam-pick hidepick" title="选择摄像头（可指定 OBS Virtual Camera）"></select>
<div id="gfx" class="camera">
  <div class="cam-head">手势识别</div>
  <video id="camVideo" playsinline muted></video>
  <canvas id="camCanvas"></canvas>
  <div id="camHint" class="cam-hint">手势：<b>等待手部</b></div>
  <div id="camClose" class="cam-close">✕</div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1;

  // ---- 手机端/触屏识别：手机自动降粒子量、抬 DPR、放大触控按钮（一套代码手机/电脑通用）----
  const IS_MOBILE = (() => {
    try {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const ua = /Mobi|Android|iPhone|iPad|iPod|HarmonyOS|Phone/i.test(navigator.userAgent);
      const small = Math.min(window.innerWidth || 9999, window.innerHeight || 9999) < 820;
      return ua || (coarse && small);
    } catch (_) { return false; }
  })();
  try { if (IS_MOBILE) document.documentElement.classList.add('is-mobile'); } catch (_) {}

  // ---- 电影级后处理：半分辨率 Bloom 柔辉 + 爆发 RGB 色散 + 胶片颗粒 ----
  const BLOOM_BASE = !/[?&]nobloom=1\b/.test(location.search);   // 泛光基线（?nobloom=1 可关；自适应降档后可按此恢复）
  let bloomCv = null, bloomCtx = null, bloomOn = BLOOM_BASE;   // 自适应降级或 ?nobloom=1 可关
  let grainCv = null, grainPat = null;
  function buildGrain() {
    const S = 128; grainCv = document.createElement('canvas'); grainCv.width = grainCv.height = S;
    const g = grainCv.getContext('2d'); const img = g.createImageData(S, S); const d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    grainPat = ctx.createPattern(grainCv, 'repeat');
  }
  let bgGrad = null, bgCv = null, hazeCv = null, vigCv = null, nebulaGrads = null, coreHaloGrad = null, nucleusGrad = null, vignetteGrad = null, bucketFill = [];

  function resize() {
    // 画质优先：内部渲染上限提到 1920x1080（用户 2560x1440 屏按 0.75 倍渲染再拉伸），
    // 明显比 1280x720 清晰；性能不足时由自适应降档兜底帧率。?maxw= 可覆盖调试。
    // 手机：retina 屏 DPR 封顶 2（够清晰又不至于太重）；桌面维持原策略
    DPR = IS_MOBILE ? Math.min(window.devicePixelRatio || 1, 2)
                    : ((window.innerWidth < 1400) ? Math.min(window.devicePixelRatio || 1, 1.25) : 1);
    W = window.innerWidth; H = window.innerHeight;
    // 手机屏窄，内部上限按 1440 宽封顶即可（手机分辨率小，天然够用）
    const MAX_W = IS_MOBILE ? 1440 : 1920, MAX_H = IS_MOBILE ? 1440 : 1080;   // ?maxw= 可覆盖调试
    const mwM = /[?&]maxw=([0-9]+)/i.exec(location.search); const MW = mwM ? parseInt(mwM[1], 10) : MAX_W;
    let scale = DPR;
    if (W * scale > MW) scale = MW / W;
    if (H * scale > MAX_H) scale = Math.min(scale, MAX_H / H);
    if (scale < 0.5) scale = 0.5;                    // 保底，别糊成马赛克
    DPR = scale;
    canvas.width = Math.max(2, Math.floor(W * DPR)); canvas.height = Math.max(2, Math.floor(H * DPR));
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.5 * 0.92, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    bgGrad.addColorStop(0, '#070a16');
    bgGrad.addColorStop(0.5, '#03040c');
    bgGrad.addColorStop(1, '#010206');
    // 把整屏静态背景预渲染成位图：逐帧直接 blit，避免每帧重新栅格化一次全屏径向渐变
    if (!bgCv) bgCv = document.createElement('canvas');
    bgCv.width = canvas.width; bgCv.height = canvas.height;
    { const bc = bgCv.getContext('2d'); bc.setTransform(DPR, 0, 0, DPR, 0, 0);
      const b2 = bc.createRadialGradient(W * 0.5, H * 0.5 * 0.92, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
      b2.addColorStop(0, '#070a16'); b2.addColorStop(0.5, '#03040c'); b2.addColorStop(1, '#010206');
      bc.fillStyle = b2; bc.fillRect(0, 0, W, H); }
    // 顶部散射雾：漂移极慢（周期约千秒级），预渲染成静态位图逐帧 blit，省掉两发全屏径向渐变
    if (!hazeCv) hazeCv = document.createElement('canvas');
    hazeCv.width = canvas.width; hazeCv.height = canvas.height;
    { const hc = hazeCv.getContext('2d'); hc.setTransform(DPR, 0, 0, DPR, 0, 0); hc.clearRect(0, 0, W, H);
      hc.globalCompositeOperation = 'lighter';
      const cX = W * 0.5, cY = -H * 0.06, bigR = Math.max(W, H) * 1.15;
      const g1 = hc.createRadialGradient(cX, cY, 0, cX, cY, bigR);
      g1.addColorStop(0, 'rgba(120,190,255,0.050)'); g1.addColorStop(0.35, 'rgba(96,162,236,0.024)');
      g1.addColorStop(0.68, 'rgba(82,140,214,0.008)'); g1.addColorStop(1, 'rgba(72,124,200,0)');
      hc.fillStyle = g1; hc.fillRect(0, 0, W, H * 0.95);
      const sx = cX - W * 0.12, sy = H * 0.05, sr = W * 0.50;
      const g2 = hc.createRadialGradient(sx, sy, 0, sx, sy, sr);
      g2.addColorStop(0, 'rgba(150,215,255,0.040)'); g2.addColorStop(0.5, 'rgba(112,182,244,0.016)'); g2.addColorStop(1, 'rgba(80,150,220,0)');
      hc.fillStyle = g2; hc.fillRect(0, 0, W, H * 0.62); }
    // 暗角预渲染成位图：逐帧 blit，省掉一次全屏径向渐变栅格化
    if (!vigCv) vigCv = document.createElement('canvas');
    vigCv.width = canvas.width; vigCv.height = canvas.height;
    { const vc = vigCv.getContext('2d'); vc.setTransform(DPR, 0, 0, DPR, 0, 0);
      const vcx = W * 0.5, vcy = H * 0.46, vr = Math.hypot(W, H) * 0.62;
      const vg = vc.createRadialGradient(vcx, vcy, Math.min(W, H) * 0.30, vcx, vcy, vr);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.60, 'rgba(2,4,12,0.26)'); vg.addColorStop(1, 'rgba(1,2,8,0.64)');
      vc.fillStyle = vg; vc.fillRect(0, 0, W, H); }
    if (nebulaGrads) buildNebulaGrads();
    // Bloom 半分辨率缓冲
    if (!bloomCv) bloomCv = document.createElement('canvas');
    bloomCv.width = Math.max(2, Math.floor(canvas.width / 4));
    bloomCv.height = Math.max(2, Math.floor(canvas.height / 4));
    bloomCtx = bloomCv.getContext('2d');
  }
  window.addEventListener('resize', resize);
  resize();
  buildGrain();

  const TAU = Math.PI * 2;
  const N = IS_MOBILE ? 14000 : 30000;   // 手机降到 14000 颗（每帧要对全部粒子做 3D 变换+绘制，手机 CPU/GPU 扛不住 3 万）
  // 圣诞树手法①：伞盖按 顶/中/缘 × 内/外 分 6 个荧光壳层，各层亮度基准不同（分层堆叠，非一团雾）
  const SHELL_BASE = [1.02, 0.90, 0.80, 0.96, 0.86, 0.74];
  const GAL_R = 460;             // 生物整体尺度（用于景深归一）
  // —— 深海水母几何 ——
  const BELL_R = 310;            // 伞盖半径
  const BELL_H = 210;            // 伞盖高（伞顶→伞缘）
  const TENT_LEN = 720;          // 触须长度
  const NTENT = 46;              // 触须条数
  const Y0 = -170;               // 伞顶在世界坐标中的竖直偏移（整体居中）

  // per-particle state
  const RADIUS = new Float32Array(N);
  const ANGLE  = new Float32Array(N);
  const HEIGHT = new Float32Array(N);
  const SIZE   = new Float32Array(N);
  const OMEGA  = new Float32Array(N);
  const PHASE  = new Float32Array(N);
  const TWK    = new Float32Array(N);
  const BUCKET = new Uint8Array(N);
  const TYPE   = new Uint8Array(N);   // 0=伞盖壳 1=触须 2=内部荧光 3=浮游微粒
  const PARAM  = new Float32Array(N); // 沿体参数 0..1（伞盖 顶→缘 / 触须 根→尖）
  const TID    = new Uint8Array(N);   // 触须所属 tentacle 索引（每根独立相位/频率/长度）

  // scratch buffers for the frame
  const sxA = new Float32Array(N);
  const syA = new Float32Array(N);
  const szA = new Float32Array(N);
  const alA = new Float32Array(N);
  const wvA = new Float32Array(N);   // 沿体光波命中强度（供颜色脉冲 pass）

  // ---- color system -------------------------------------------------------
  // Each theme is a radial color ramp (core-warm -> mid -> outer-cool), plus
  // an HII accent (pink knots) and a bright core tone.
  const NB = 16;                 // gradient buckets (by radius)
  const B_HII = NB;              // pink HII nebula knots
  const B_BLUE = NB + 1;         // blue young star clusters
  const B_CORE = NB + 2;         // brightest warm core / bar stars
  const NB_ALL = NB + 3;

  const THEMES = [
    { // 深海荧光 — 青白伞顶 / 青绿 / 幽蓝
      stops: [[0,[235,255,252]],[0.16,[150,250,225]],[0.42,[70,205,235]],[0.72,[70,120,240]],[1,[38,58,150]]],
      accent: [185,140,255], core: [225,255,250]
    },
    { // 幽紫水母 — 紫蓝荧光
      stops: [[0,[250,240,255]],[0.16,[220,170,255]],[0.42,[175,120,250]],[0.72,[110,90,235]],[1,[50,40,140]]],
      accent: [120,235,255], core: [245,235,255]
    },
    { // 翠绿 — 生物荧光绿
      stops: [[0,[240,255,240]],[0.16,[170,255,190]],[0.42,[80,235,170]],[0.72,[40,180,200]],[1,[20,90,140]]],
      accent: [255,150,200], core: [235,255,240]
    },
    { // 冰蓝 — 冷青
      stops: [[0,[240,255,255]],[0.16,[170,245,255]],[0.42,[90,200,255]],[0.72,[70,140,250]],[1,[34,60,165]]],
      accent: [200,160,255], core: [235,255,255]
    }
  ];
  let theme = 0;

  function lerpStops(stops, t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i + 1];
      if (t >= a[0] && t <= b[0]) {
        const f = (t - a[0]) / ((b[0] - a[0]) || 1);
        return [
          a[1][0] + (b[1][0] - a[1][0]) * f,
          a[1][1] + (b[1][1] - a[1][1]) * f,
          a[1][2] + (b[1][2] - a[1][2]) * f
        ];
      }
    }
    return stops[stops.length - 1][1].slice();
  }

  // Pre-rendered soft glow sprites (one per color bucket) — the single biggest
  // visual upgrade vs. drawing hard squares.
  function makeGlowSprite(rgb) {
    const S = 64, cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const g = cv.getContext('2d');
    const r = Math.round(rgb[0]), gg = Math.round(rgb[1]), b = Math.round(rgb[2]);
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    // 收紧光斑：亮实心核 + 快速衰减，让每颗读作“颗粒点”而非一团软雾
    grd.addColorStop(0.00, `rgba(${r},${gg},${b},1)`);
    grd.addColorStop(0.10, `rgba(${r},${gg},${b},0.96)`);
    grd.addColorStop(0.24, `rgba(${r},${gg},${b},0.46)`);
    grd.addColorStop(0.46, `rgba(${r},${gg},${b},0.10)`);
    grd.addColorStop(0.72, `rgba(${r},${gg},${b},0.025)`);
    grd.addColorStop(1.00, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = grd; g.fillRect(0, 0, S, S);
    return cv;
  }

  let sprites = [];
  let starSprite = null;
  let moteSpriteA = null, moteSpriteB = null;
  function buildSprites() {
    const th = THEMES[theme];
    sprites = []; bucketFill = [];
    const push = (rgb) => {
      sprites.push(makeGlowSprite(rgb));
      bucketFill.push('rgb(' + Math.round(rgb[0]) + ',' + Math.round(rgb[1]) + ',' + Math.round(rgb[2]) + ')');
    };
    for (let b = 0; b < NB; b++) push(lerpStops(th.stops, b / (NB - 1)));
    push(th.accent);        // B_HII  — 粉红 HII 星云团
    push([90, 225, 205]);   // B_BLUE — 触须青绿荧光
    push(th.core);          // B_CORE — 暖白/金核球与棒
    buildNebulaGrads();
  }
  // cache nebula + core-halo radial gradients (rebuilt only on theme change / resize)
  function buildNebulaGrads() {
    const th = THEMES[theme];
    const c1 = lerpStops(th.stops, 0.25), c2 = lerpStops(th.stops, 0.75), ca = th.accent;
    const M = Math.max(W, H);
    const blobs = [
      [W * 0.30, H * 0.32, M * 0.62, c1, 0.055],
      [W * 0.73, H * 0.70, M * 0.74, c2, 0.050],
      [W * 0.52, H * 0.50, M * 0.92, ca, 0.016]
    ];
    nebulaGrads = blobs.map(([x, y, r, c, a]) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const cs = `${c[0] | 0},${c[1] | 0},${c[2] | 0}`;
      g.addColorStop(0, `rgba(${cs},${a})`);
      g.addColorStop(0.62, `rgba(${cs},${a * 0.34})`);
      g.addColorStop(1, `rgba(${cs},0)`);
      return { g, x, y, r };
    });

        ripples.push({ x: tap.x, y: tap.y, r: 0, max: Math.max(W, H) * 1.35 });
        detonateQueued = 150;
        sfxBurst();
      }
      tap = null;
      if (pointers.size === 0) {
        gesture = 'none'; canvas.classList.remove('drag');
        if (e.pointerType !== 'mouse') mouseOn = false;
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', e => {
    if (e.pointerType === 'mouse') { mouseOn = false; mx = my = -9999; }
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    tZoom *= (e.deltaY > 0 ? 0.9 : 1.111);
    tZoom = Math.max(0.45, Math.min(3.2, tZoom));
  }, { passive: false });

  canvas.addEventListener('dblclick', () => { tRotX = BASE_PITCH; spinBase = 0; handYaw = 0; handPitch = 0; tRoll = 0; tZoom = 1; tBellOpen = 1; velX = velY = 0; });

  window.addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
