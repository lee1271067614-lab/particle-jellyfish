<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>手部识别透视</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#05070f;color:#dfe9ff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{padding:12px 12px 32px}
  h2{font-size:16px;margin:4px 0 8px;letter-spacing:.05em}
  .sub{font-size:12px;color:#8fa3c8;margin:0 0 10px;line-height:1.6}
  button{width:100%;padding:14px;border-radius:12px;border:1px solid #3a5aa8;background:#16224a;color:#dfe9ff;font-size:16px;margin-bottom:10px}
  button:active{filter:brightness(1.2)}
  .box{position:relative;background:#000;border-radius:12px;overflow:hidden;border:1px solid #23345f;max-width:440px;margin:0 auto}
  video{display:block;width:100%;height:auto;transform:scaleX(-1)}
  #ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #badge{position:absolute;left:10px;top:10px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.6)}
  .ok{color:#7cf39a}.bad{color:#ff9d9d}.warn{color:#ffd45e}
  #status{white-space:pre-wrap;word-break:break-all;font:13px/1.6 ui-monospace,Consolas,monospace;background:#0a1020;border:1px solid #1d2b52;border-radius:10px;padding:10px;margin-top:10px}
  .tip{font-size:12px;color:#9fb2d6;margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<h2>手部识别透视</h2>
<p class="sub">点开始后看画面：<b>手部骨架（蓝点+连线）跟不跟得住你的手</b>。跟得住=模型看到你的手；完全不出点=模型没看到。</p>
<button id="go">开始</button>
<div class="box">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="badge" class="warn">待开始</div>
</div>
<div id="status">点「开始」，用前置摄像头对着手。</div>
<div class="tip">手离镜头 30~60cm、整只手入镜、光线充足、掌心朝镜头。支持竖屏或横屏。</div>
<script type="module">
const $ = s => document.querySelector(s);
const v = $('#v'), ov = $('#ov'), octx = ov.getContext('2d'), badge = $('#badge'), st = $('#status');
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let lm=null, delegate='', cv, cx, running=false, frames=0, hits=0, errs=0, lastErr='', bestScore=null, fpsT=0, fpsN=0, fps=0;
function setStatus(cls,txt){ badge.className=cls; badge.textContent=txt; }

async function start(){
  if (running) return; running=true; setStatus('warn','启动中…');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'user'}, width:{ideal:640}, height:{ideal:480} }, audio:false });
    v.srcObject = stream; await v.play();
    await new Promise(r=>setTimeout(r,300));
    ov.width = v.videoWidth||640; ov.height = v.videoHeight||480;
    st.textContent = '摄像头 OK '+(v.videoWidth)+'x'+(v.videoHeight)+'（'+(v.videoWidth>=v.videoHeight?'横屏':'竖屏')+'）\n正在加载模型…';
  }catch(e){ setStatus('bad','摄像头失败'); st.textContent='摄像头失败：'+e.name+' '+e.message; running=false; return; }

  try{
    const vision = await import('./vendor/mediapipe/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks('./vendor/mediapipe/wasm');
    const opts = d => ({ baseOptions:{ modelAssetPath:'./vendor/hand_landmarker.task', delegate:d }, runningMode:'VIDEO', numHands:1,
      minHandDetectionConfidence:0.4, minHandPresenceConfidence:0.4, minTrackingConfidence:0.45 });
    try{ lm = await vision.HandLandmarker.createFromOptions(fileset, opts('CPU')); delegate='CPU'; }
    catch(e1){ lm = await vision.HandLandmarker.createFromOptions(fileset, opts('GPU')); delegate='GPU'; }
  }catch(e){ setStatus('bad','模型失败'); st.textContent='模型加载失败：'+(e&&(e.message||e)); running=false; return; }

  cv = document.createElement('canvas'); cv.width=256; cv.height=192; cx = cv.getContext('2d');
  let last=0;
  const tick=()=>{
    if(!running) return;
    const now=performance.now();
    // 检测降频 ~12Hz，绘制每帧都做以跟手
    if(now-last>=80 && v.readyState>=2){
      last=now;
      try{
        const vw=v.videoWidth||640, vh=v.videoHeight||480;
        const s=Math.min(256/vw,192/vh), tw=Math.round(vw*s), th=Math.round(vh*s);
        cx.fillStyle='#000'; cx.fillRect(0,0,256,192); cx.drawImage(v,(256-tw)>>1,(192-th)>>1,tw,th);
        const res=lm.detectForVideo(cv, now);
        frames++; errs=0;
        if(res && res.landmarks && res.landmarks.length){
          hits++; const p=res.landmarks[0];
          const hs=res.handedness||res.handednesses; bestScore = hs&&hs[0]&&hs[0][0]?hs[0][0].score:bestScore;
          drawSkel(p);
        } else { bestScore = bestScore; octx.clearRect(0,0,ov.width,ov.height); }
      }catch(e){ errs++; lastErr=(e&&(e.message||e))+''; }
    }
    // 读数
    if(!fpsT) fpsT=now; fpsN++;
    if(now-fpsT>500){ fps=Math.round(fpsN*1000/(now-fpsT)); fpsN=0; fpsT=now;
      const seen = (hits>0);
      setStatus(seen?'ok':'bad', seen?'检测到手 ✓':'未检测到手');
      st.textContent =
        '后端 '+delegate+' | '+fps+'/s（推理'+frames+'帧 错误'+errs+'）\n'+
        '视频 '+(v.videoWidth)+'x'+(v.videoHeight)+'（'+(v.videoWidth>=v.videoHeight?'横屏':'竖屏')+'）\n'+
        '检测到手：'+(seen?'是':'否')+'  最高置信：'+(bestScore==null?'—':bestScore.toFixed(2))+
        (errs?('\n最近错误：'+lastErr):'');
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function drawSkel(p){
  const W=ov.width, H=ov.height; octx.clearRect(0,0,W,H);
  octx.lineWidth=Math.max(2,W/220); octx.strokeStyle='rgba(120,220,255,.9)';
  octx.fillStyle='rgba(160,240,255,.95)';
  for(const [a,b] of CONN){ octx.beginPath(); octx.moveTo((1-p[a].x)*W,p[a].y*H); octx.lineTo((1-p[b].x)*W,p[b].y*H); octx.stroke(); }
  for(let i=0;i<21;i++){ octx.beginPath(); octx.arc((1-p[i].x)*W,p[i].y*H,i%4===0?Math.max(3,W/150):Math.max(2,W/220),0,Math.PI*2); octx.fill(); }
}
$('#go').addEventListener('click', start);
</script>
</body>
</html>
